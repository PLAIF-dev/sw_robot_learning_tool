services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robot-learning-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Auth__Password: ${AUTH_PASSWORD:-1111}
    networks:
      - robot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: robot-learning-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - robot-net

networks:
  robot-net:
    driver: bridge
